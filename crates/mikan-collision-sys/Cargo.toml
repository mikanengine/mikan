[package]
name = "mikan-collision-sys"
description = "Raw C narrow-phase kernel and ABI mirror for mikan-collision: one pure batch function, compiled with warnings-as-errors."
links = "mikan_contacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
# The workspace forbids `unsafe_code` crate-wide; this is the one crate allowed
# to bridge into C (the reason is recorded in the crate root, per docs/ffi.md).
# Cargo cannot inherit the workspace lints and override one in the same table,
# so the three workspace lints are repeated here with `unsafe_code = "allow"`;
# everything else matches the workspace table exactly.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[build-dependencies]
cc.workspace = true
