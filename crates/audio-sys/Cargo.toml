[package]
name = "mikan-audio-sys"
description = "Raw native audio module for mikan-audio: a C device backend (miniaudio plus a deterministic offline device) and a C++ playback runtime and mixer behind one extern-C ABI, compiled with warnings-as-errors."
links = "mikan_audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
# The workspace forbids `unsafe_code` crate-wide; this is one of the crates
# allowed to bridge into the native audio module (the reason is recorded in
# the crate root, per docs/ffi.md). Cargo cannot inherit the workspace lints
# and override one in the same table, so the three workspace lints are
# repeated here with `unsafe_code = "allow"`; everything else matches the
# workspace table exactly.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[build-dependencies]
cc.workspace = true
