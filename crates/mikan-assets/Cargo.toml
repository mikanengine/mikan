[package]
name = "mikan-assets"
description = "CPU-side asset loading for Mikan: PNG images decoded to RGBA8 and sprite-sheet metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
mikan-core.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Used by the tests to hand-craft PNG files the `png` encoder cannot write
# (interlaced images, deliberately short image data). Both are already in the
# dependency tree through `png` itself.
crc32fast = "1.5"
flate2 = "1.1"
