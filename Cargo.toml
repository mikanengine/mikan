[workspace]
resolver = "3"
members = ["crates/*", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neverseeyouagainnnnn/mikan"
description = "A small, modular game engine. 2D first, then 3D. Rust at the core, C at the foundation, C++ where it counts."
keywords = ["game-engine", "gamedev", "wgpu", "winit", "2d"]
categories = ["game-engines", "graphics", "game-development"]

[workspace.dependencies]
# Engine crates. Crate directories use the plain subsystem name
# (`crates/core`, `crates/render`, ...); the published package keeps the
# `mikan-` prefix.
mikan = { path = "crates/mikan", version = "0.1.0" }
mikan-assets = { path = "crates/assets", version = "0.1.0" }
mikan-collision = { path = "crates/collision", version = "0.1.0" }
mikan-collision-sys = { path = "crates/collision-sys", version = "0.1.0" }
mikan-core = { path = "crates/core", version = "0.1.0" }
mikan-ecs = { path = "crates/ecs", version = "0.1.0" }
mikan-input = { path = "crates/input", version = "0.1.0" }
mikan-input-sys = { path = "crates/input-sys", version = "0.1.0" }
mikan-platform = { path = "crates/platform", version = "0.1.0" }
mikan-render = { path = "crates/render", version = "0.1.0" }
mikan-scene = { path = "crates/scene", version = "0.1.0" }
mikan-scene-sys = { path = "crates/scene-sys", version = "0.1.0" }
mikan-script = { path = "crates/script", version = "0.1.0" }

# Upstream dependencies. Versions are the oldest release of the current
# compatible series that has been verified to build with the pinned toolchain.
bytemuck = { version = "1.25", features = ["derive"] }
cc = "1.8"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4.34"
# 0.11.6 is the newest mlua whose Rust requirement (1.85) stays under the
# workspace MSRV; 0.12 requires 1.88. `luau` selects the Luau VM, `vendored`
# builds the pinned upstream C++ sources with the system compiler.
mlua = { version = "0.11.6", features = ["luau", "vendored"] }
png = "0.18.1"
pollster = "1.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
wgpu = "30.0.1"
winit = "0.30.13"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
